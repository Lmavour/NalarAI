<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176BFF" />
    <title>NalarAI sedang offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7fbff; color: #10233f; font-family: "Nunito", "Avenir Next", system-ui, sans-serif; }
      main { width: min(100%, 440px); text-align: center; }
      .logo { width: 76px; height: 76px; margin: 0 auto 28px; display: grid; place-items: center; border-radius: 24px; background: #176bff; color: white; box-shadow: 0 6px 0 #0f52cc; font-size: 34px; font-weight: 950; }
      h1 { margin: 0; font-size: clamp(30px, 8vw, 42px); line-height: 1.05; letter-spacing: -0.04em; }
      p { margin: 18px auto 0; max-width: 380px; color: #4d6078; font-size: 17px; line-height: 1.7; }
      button { min-height: 52px; margin-top: 28px; border: 0; border-radius: 16px; padding: 0 24px; background: #176bff; color: white; box-shadow: 0 5px 0 #0f52cc; font: 800 16px/1 system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">N</div>
      <h1>Koneksi sedang beristirahat.</h1>
      <p>Jalur dan progresmu tetap aman. Sambungkan internet lalu coba kembali untuk membuat pelajaran AI berikutnya.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
